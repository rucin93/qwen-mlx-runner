[package]
name = "qwen-metal"
version = "0.6.3"
edition = "2024"
description = "Independent Rust and Metal inference for dense Qwen3.5/3.8 text models"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
metal = "0.32"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["loader", "json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.rust]
# objc 0.2's selector macro references this legacy dependency feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
